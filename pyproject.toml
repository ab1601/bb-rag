[project]
name = "bb-rag"
version = "0.2.0"
description = "Lokales RAG- und Agentensystem über die Zeitschrift „Baltische Briefe“ (LlamaIndex, Chroma, Ollama)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: braucht Ollama und den lokalen Index (pytest -m integration)"]
addopts = "-m 'not integration'"

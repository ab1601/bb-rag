name: CI/CD

# CI: jeder Push und Pull Request wird getestet (Tests, Docker-Build, Kubernetes-Manifeste).
# CD: nach erfolgreicher CI auf main oder bei einem Versions-Tag (v1.0.0) wird das Image
#     in die GitHub Container Registry veröffentlicht: ghcr.io/ab1601/bb-rag
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Abhängigkeiten (PyTorch CPU)
        run: |
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Tests (erfundenes Mini-Korpus, ohne Sprachmodell)
        run: |
          set -o pipefail
          pytest -v 2>&1 | tee pytest.log || {
            echo "::error title=pytest::$(tail -c 3500 pytest.log | tr '\n' ' ')"
            exit 1
          }

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bb-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-Test im Container
        run: docker run --rm bb-rag:ci python -c "import bb_rag.agent, bb_rag.tools; print('ok')"

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kubernetes-Manifeste prüfen (kubeconform)
        run: |
          docker run --rm -v "$PWD/k8s:/k8s" ghcr.io/yannh/kubeconform:latest \
            -strict -summary -ignore-filename-pattern kustomization /k8s

  publish:
    name: publish (CD → ghcr.io)
    runs-on: ubuntu-latest
    needs: [test, docker, kubernetes]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Anmeldung bei der GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags und Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=bb-rag
            org.opencontainers.image.description=Lokales RAG- und Agentensystem (LlamaIndex, Chroma, Ollama) – ohne Daten
      - name: Image bauen und veröffentlichen (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
